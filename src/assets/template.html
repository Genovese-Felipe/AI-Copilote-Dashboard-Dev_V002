<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="Dashboard interativo para análise de incidentes com IA e visualização de dados">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-robot"></i> {{title}}</h1>
            <div class="subtitle">{{subtitle}}</div>
            <div class="timestamp">📅 Relatório gerado em {{timestamp}}</div>
        </div>

        <!-- Statistics Grid -->
        <div class="stats-grid">
            {{stats_grid}}
        </div>

        <!-- Controls Panel (can be added here if needed) -->

        <!-- Dashboard Container -->
        <div class="dashboard-container">
            <div class="dashboard-header">
                <div class="dashboard-title">📊 Visualizações Interativas</div>
                <div class="dashboard-subtitle">Análise multidimensional dos dados de incidentes</div>
            </div>
            {{plotly_graph}}
        </div>

        <!-- Footer -->
        <div class="footer">
            {{footer}}
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
